<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Keepfall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Saira+Stencil+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#cfd8c6;--board:#dfe6d6;--panel:#eef2e8;--ink:#24312b;--muted:#5b695f;--line:#9fad96;--path:#aab69f;--accent:#2e5c4b;--accent-ink:#f3f6ef;--neutral:#8e968a;--neutral-ink:#ffffff;--dot:rgba(36,49,43,.10);--ta:rgba(255,255,255,.35);--tb:rgba(60,90,60,.14);--tree:#8fa283;--road:#e9e4d2;--road-edge:#a8a58f;--fog:#c4ccbc;--water:#9cc3cf;--water-edge:#7aa6b3;--hill:rgba(90,110,80,.22);--gold:#d9a521;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --title:'Saira Stencil One','Arial Black',Impact,sans-serif;--body:'Barlow Semi Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b18;--board:#1b2420;--panel:#212c27;--ink:#e2e9dc;--muted:#97a497;--line:#3a4841;--path:#3a4842;--accent:#8cc0a5;--accent-ink:#12201a;--neutral:#5d665f;--neutral-ink:#e9eee6;--dot:rgba(226,233,220,.06);--ta:rgba(120,160,130,.07);--tb:rgba(0,0,0,.22);--tree:#2a3a31;--road:#3c4a42;--road-edge:#131a17;--fog:#0e1411;--water:#24424c;--water-edge:#172e35;--hill:rgba(200,220,190,.10);--gold:#e8b53a;}}
:root[data-theme="dark"]{--bg:#141b18;--board:#1b2420;--panel:#212c27;--ink:#e2e9dc;--muted:#97a497;--line:#3a4841;--path:#3a4842;--accent:#8cc0a5;--accent-ink:#12201a;--neutral:#5d665f;--neutral-ink:#e9eee6;--dot:rgba(226,233,220,.06);--ta:rgba(120,160,130,.07);--tb:rgba(0,0,0,.22);--tree:#2a3a31;--road:#3c4a42;--road-edge:#131a17;--fog:#0e1411;--water:#24424c;--water-edge:#172e35;--hill:rgba(200,220,190,.10);--gold:#e8b53a;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:500;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column;max-width:100%}
.screen{display:none;flex:1;min-height:0;flex-direction:column;overflow:auto}
.screen.on{display:flex}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:block;width:100%;padding:14px 18px;border:2px solid var(--ink);border-radius:12px;background:var(--panel);font-weight:700;font-size:1.1rem;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:8px;font-size:1rem}
/* menu */
.menu{margin:auto;width:100%;max-width:420px;padding:28px 22px;display:flex;flex-direction:column;gap:12px}
.emblem{width:170px;height:auto;margin:0 auto 4px;display:block}
.title{font-family:var(--title);font-weight:400;font-size:clamp(3rem,15vw,4.4rem);line-height:.9;margin:0;text-align:center;letter-spacing:.01em}
.tag{margin:4px 0 14px;text-align:center;color:var(--muted);font-size:1.12rem;line-height:1.35}
.field{display:flex;align-items:center;gap:10px;padding:0 4px 6px;font-weight:600}
.field input{flex:1;min-width:0;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--panel);font-size:1.05rem}
.note{color:var(--muted);font-size:.95rem;line-height:1.35;margin:2px 4px;text-align:center}
/* bars */
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:2px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.bar h2{margin:0;font-size:1.3rem;font-weight:700}
.icon{width:42px;height:42px;border:2px solid var(--ink);border-radius:10px;background:var(--panel);font-size:1.3rem;line-height:1;display:grid;place-items:center;flex:none;padding:0}
.wrap{width:100%;max-width:520px;margin:0 auto;padding:14px 14px 24px;display:flex;flex-direction:column;gap:12px}
.code-box{border:2px dashed var(--ink);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.code-box b{font-family:var(--title);font-weight:400;font-size:2.1rem;letter-spacing:.12em}
.code-box small{color:var(--muted);font-size:.95rem;flex-basis:100%}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 10px;min-height:54px}
.slot.off{opacity:.55}
.hex{width:26px;height:26px;flex:none;background:var(--c);clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.slot .who{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .who small{font-weight:500;color:var(--muted);margin-left:6px}
.slot select{flex:1;min-width:0;padding:8px;border:2px solid var(--line);border-radius:9px;background:var(--bg);font-weight:600}
.slot select.team{flex:0 0 96px}
.slot .kick{border:0;background:none;color:var(--muted);font-size:1.3rem;padding:4px 8px}
.team-tag{flex:none;font-weight:700;color:var(--muted);min-width:60px;text-align:right}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:10px}
.opt>span{width:78px;font-weight:600;color:var(--muted)}
.seg{flex:1;display:flex;border:2px solid var(--ink);border-radius:11px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--panel);padding:10px 4px;font-weight:700}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.msg{min-height:1.3em;margin:0;color:var(--muted);text-align:center}
.games{display:flex;flex-direction:column;gap:8px}
.game-item{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border:2px solid var(--ink);border-radius:12px;background:var(--panel)}
.game-item b{font-family:var(--title);font-weight:400;font-size:1.4rem;letter-spacing:.08em}
.game-item span{flex:1;color:var(--muted)}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;padding:12px;border:2px solid var(--ink);border-radius:12px;background:var(--panel);font-family:var(--title);font-size:1.5rem;letter-spacing:.2em;text-transform:uppercase;text-align:center}
.row .btn{width:auto}
.empty{color:var(--muted);text-align:center;padding:14px;border:2px dashed var(--line);border-radius:12px}
/* game */
#s-game{overflow:hidden}
.hud{display:flex;align-items:center;gap:10px;padding:8px 10px;flex:none}
.power{flex:1;height:14px;display:flex;border-radius:7px;overflow:hidden;border:2px solid var(--ink);background:var(--panel)}
.power i{display:block;height:100%;transition:flex-grow .4s}
#clock{font-variant-numeric:tabular-nums;font-weight:700;min-width:44px;text-align:right}
.stage{flex:1;min-height:0;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-weight:600;max-width:90%;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s}
.toast.show{opacity:.95}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,16,13,.55);z-index:10;padding:20px}
.overlay[hidden]{display:none}
.card{width:100%;max-width:380px;background:var(--panel);border:2px solid var(--ink);border-radius:16px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 0 var(--ink);max-height:85vh;overflow:auto}
.card h3{font-family:var(--title);font-weight:400;font-size:2.4rem;margin:0;text-align:center;line-height:1}
.card p{margin:0;line-height:1.45;color:var(--ink)}
.card p.sub{text-align:center;color:var(--muted);font-size:1.1rem}
.card .help p+p{margin-top:10px}

.stage canvas{cursor:grab}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zoom button{width:42px;height:42px;border:2px solid var(--ink);border-radius:10px;background:var(--panel);font-size:1.35rem;font-weight:700;line-height:1;display:grid;place-items:center;padding:0;box-shadow:0 2px 0 var(--ink)}
.toast{top:10px;bottom:auto}
.wbanner:not([hidden])~.toast,.stage:has(.wbanner:not([hidden])) .toast{top:58px}
.actions{flex:none;display:flex;gap:8px;padding:8px 10px;align-items:center;border-top:2px solid var(--line);background:var(--bg)}
.actions .lbl{font-weight:700;color:var(--muted)}
.actions .seg button{padding:9px 2px}
.mode{flex:none;border:2px solid var(--ink);border-radius:11px;padding:9px 12px;font-weight:700;background:var(--panel)}
.mode[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.panel{position:absolute;left:8px;right:8px;bottom:8px;max-width:440px;margin:0 auto;background:var(--panel);border:2px solid var(--ink);border-radius:14px;padding:10px 12px 12px;box-shadow:0 4px 0 var(--ink);z-index:4}
.panel[hidden]{display:none}
.ph{display:flex;align-items:center;gap:10px}
.ph .t{flex:1;min-width:0}
.ph b{font-size:1.15rem;display:block}
.ph small{display:block;color:var(--muted);font-size:.95rem}
.ph .x{border:0;background:none;font-size:1.5rem;padding:2px 6px;color:var(--muted)}
.upg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.upg button{border:2px solid var(--line);border-radius:10px;background:var(--bg);padding:7px 9px;text-align:left;line-height:1.2}
.upg button b{display:block;font-size:1rem}
.upg button small{color:var(--muted);font-size:.85rem}
.upg button:disabled{opacity:.42;cursor:default}
.upg .done{grid-column:1/-1;color:var(--muted);font-size:.95rem;padding:2px 2px 0}
.bar-prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}
.bar-prog i{display:block;height:100%;background:var(--accent)}
.rt{display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:600}
.rt span{flex:1}
.rt button{border:2px solid var(--ink);border-radius:9px;background:var(--bg);padding:6px 10px;font-weight:700}

.hud{flex-wrap:nowrap;gap:8px;padding:6px 8px}
.res{display:flex;align-items:baseline;gap:4px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.res small{font-weight:600;color:var(--muted);font-size:.85rem}
.ico{width:14px;height:14px;display:inline-block;align-self:center;flex:none}
.ico.coin{border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}
.ico.shield{background:var(--ink);clip-path:polygon(50% 0,100% 18%,92% 62%,50% 100%,8% 62%,0 18%)}
.ico.tower{background:var(--ink);clip-path:polygon(0 100%,0 20%,20% 20%,20% 0,40% 0,40% 20%,60% 20%,60% 0,80% 0,80% 20%,100% 20%,100% 100%)}
.ico.crown{background:var(--gold);clip-path:polygon(0 100%,0 25%,25% 55%,50% 10%,75% 55%,100% 25%,100% 100%)}
.hud .sp{flex:1}
.powerbar{height:6px;display:flex;margin:0 10px 4px;border-radius:3px;overflow:hidden;background:var(--line)}
.powerbar i{display:block;height:100%;transition:flex-grow .5s}
.actions{gap:6px;padding:6px 8px}
.ab{flex:1;position:relative;overflow:hidden;border:2px solid var(--ink);border-radius:11px;background:var(--panel);padding:6px 4px 5px;line-height:1.1;box-shadow:0 2px 0 var(--ink)}
.ab b{display:block;font-size:.98rem}
.ab small{display:block;color:var(--muted);font-weight:600;font-size:.8rem}
.ab .cdv{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);width:0}
.ab.dim{opacity:.5}
.ab.arm{background:var(--accent);color:var(--accent-ink)}
.ab.arm small{color:var(--accent-ink)}
.panel{max-height:52%;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:.82rem;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--bg);border:1.5px solid var(--line)}
.chip.warn{border-color:#d9822b;color:#b8661b}
.chip.bad{border-color:#d94a4a;color:#c43d3d}
.chip.good{border-color:var(--accent);color:var(--accent)}
.tog{display:flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden;margin-top:8px}
.tog button{flex:1;border:0;background:var(--bg);padding:7px 4px;font-weight:700;line-height:1.15}
.tog button small{display:block;font-weight:500;font-size:.78rem;color:var(--muted)}
.tog button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tog button[aria-pressed="true"] small{color:var(--bg);opacity:.8}
.pings{display:flex;gap:6px;margin-top:8px}
.pings button{flex:1;border:2px solid var(--line);border-radius:9px;background:var(--bg);padding:6px;font-weight:700}
.sec{margin-top:8px;font-weight:700;color:var(--muted);font-size:.88rem}
.rs{display:flex;flex-direction:column;gap:12px}
.rb h4{margin:0 0 6px;font-size:1.05rem}
.rrow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rbtn{position:relative;overflow:hidden;border:2px solid var(--line);border-radius:10px;background:var(--bg);padding:7px 9px;text-align:left;line-height:1.2}
.rbtn.full{grid-column:1/-1}
.rbtn b{display:block}
.rbtn small{color:var(--muted);font-size:.82rem}
.rbtn.done{border-color:var(--accent);background:var(--panel)}
.rbtn.done b::after{content:" ✓";color:var(--accent)}
.rbtn:disabled{opacity:.45;cursor:default}
.rbtn.done:disabled{opacity:1}
.rbtn i{position:absolute;left:0;bottom:0;height:4px;background:var(--accent)}
.stats canvas{width:100%;height:140px;display:block;border:2px solid var(--line);border-radius:10px;background:var(--bg)}
.hl{display:flex;flex-direction:column;gap:4px;font-size:.98rem}
.hl span{color:var(--muted)}
.chip .dem{border:0;background:none;padding:0 0 0 4px;font:inherit;font-weight:700;color:inherit;cursor:pointer}
.slot{flex-wrap:wrap}
.slot select.pe{flex:0 0 108px}
.mtsel{flex:1;padding:10px;border:2px solid var(--ink);border-radius:11px;background:var(--panel);font:inherit;font-weight:700;color:var(--ink)}
.mix{flex:none;display:flex;gap:5px;padding:6px 8px 0;align-items:center}
.mix .lbl{font-weight:700;color:var(--muted);font-size:.9rem;margin-right:2px}
.mix button{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;border:2px solid var(--line);border-radius:10px;background:var(--panel);padding:5px 2px;font:inherit;font-weight:700;font-size:.88rem;color:var(--muted)}
.mix button svg{width:16px;height:16px}
.mix button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--bg)}
.mix button.info{flex:0 0 34px;color:var(--ink)}
.utog{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}
.utog button{border:2px solid var(--line);border-radius:9px;background:var(--bg);padding:5px 2px;font:inherit;font-weight:700;font-size:.85rem;color:var(--ink);line-height:1.15}
.utog button small{display:block;font-weight:500;color:var(--muted);font-size:.75rem}
.utog button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.utog button[aria-pressed="true"] small{color:var(--accent-ink)}
.utog button:disabled{opacity:.45}
.ut p{margin:0 0 8px}
.twb{border:2px solid var(--line);border-radius:9px;background:var(--bg);padding:5px 9px;font:inherit;font-weight:700;color:var(--ink);text-align:left;line-height:1.15}
.twb small{display:block;font-weight:500;color:var(--muted);font-size:.78rem}
.twb:disabled{opacity:.45}
.missions{display:flex;flex-direction:column;gap:10px}
.mission{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:2px solid var(--ink);border-radius:14px;background:var(--panel);padding:12px 14px;box-shadow:0 3px 0 var(--ink);font:inherit;color:var(--ink)}
.mission .n{font-family:var(--title);font-size:1.8rem;width:34px;text-align:center;flex:none}
.mission .t{flex:1;min-width:0}
.mission b{display:block;font-size:1.1rem}
.mission small{display:block;color:var(--muted);font-size:.92rem;line-height:1.3}
.mission .st{flex:none;font-weight:700;color:var(--accent)}
.mission:disabled{opacity:.45;box-shadow:none}
.tut{position:absolute;left:8px;right:60px;top:8px;max-width:420px;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px;z-index:5;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.tut[hidden]{display:none}
.tut b{display:block;font-size:1.02rem;margin-bottom:2px}
.tut p{margin:0;line-height:1.35;font-size:.95rem}
.tut .link{color:var(--bg);opacity:.75;padding:4px 0 0;font-size:.85rem}
.replaybar{display:none;flex:none;align-items:center;gap:8px;padding:8px 10px;border-top:2px solid var(--line);background:var(--bg)}
#s-game.replay .replaybar{display:flex}
#s-game.replay .mix,#s-game.replay .actions{display:none}
.replaybar input{flex:1;min-width:0;accent-color:var(--accent)}
.replaybar #rp-time{font-variant-numeric:tabular-nums;font-weight:700;font-size:.9rem;white-space:nowrap}
.rp-speed{border:2px solid var(--ink);border-radius:10px;background:var(--panel);font:inherit;font-weight:700;padding:8px 10px;color:var(--ink)}
.wbanner{position:absolute;left:50%;transform:translateX(-50%);top:10px;display:flex;flex-direction:column;gap:4px;z-index:4;pointer-events:none;max-width:70%}
.wbanner[hidden]{display:none}
.wbanner div{background:rgba(30,26,14,.88);color:#ffe08a;border-left:5px solid #e3b43c;border-radius:8px;padding:4px 10px;font-weight:700;font-size:.9rem;white-space:nowrap;text-align:center}
.upg button.full{grid-column:1/-1}
.hudbtn{border:2px solid var(--ink);border-radius:9px;background:var(--panel);font:inherit;font-weight:700;font-size:.85rem;padding:4px 8px;color:var(--ink);min-width:36px}
.hudbtn[hidden]{display:none}
#dn{font-size:1rem;color:var(--muted)}
.btn.daily{display:flex;flex-direction:column;align-items:center;line-height:1.2}
.btn.daily small{font-weight:600;font-size:.82rem;color:var(--muted)}
.pausetag{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);background:rgba(20,24,20,.75);color:#fff;font-weight:700;font-size:1.4rem;padding:10px 22px;border-radius:12px;z-index:4;pointer-events:none}
.pausetag[hidden]{display:none}
@media (max-width:430px){.hud .res[title="Castles you own"]{display:none}.hud{gap:6px}.hudbtn{min-width:30px;padding:3px 6px}.res small{font-size:.75rem}}
#clock{min-width:38px}
.code-box[hidden]{display:none}
.game-row{display:flex;gap:6px}
.game-row .game-item{flex:1}
.game-row .watch{flex:none;border:2px solid var(--ink);border-radius:12px;background:var(--panel);font:inherit;font-weight:700;padding:0 14px;color:var(--ink)}
.stattabs{margin:0 0 6px;flex:none}
.stattabs button{padding:7px 2px}
.rinst{display:flex;flex-direction:column;gap:8px;margin:0 0 10px}
.rinst label{display:flex;gap:8px;align-items:center;font-weight:600}
.rinst input{width:20px;height:20px;accent-color:var(--accent)}
@media (prefers-reduced-motion:reduce){.btn,.power i,.toast{transition:none}}
</style>
</head>
<body>
<div id="app">
<section id="s-menu" class="screen on">
  <div class="menu">
    <svg class="emblem" viewBox="0 0 170 90" aria-hidden="true">
      <g stroke="currentColor" stroke-width="4" stroke-linecap="round" opacity=".45"><line x1="30" y1="60" x2="85" y2="28"/><line x1="85" y1="28" x2="140" y2="58"/><line x1="30" y1="60" x2="140" y2="58"/></g>

  x.lineJoin='round';
  for(const b of G.bars)if(b.k==='w'){rp(b.pts);x.strokeStyle='#b69a68';x.lineWidth=56;x.stroke();x.strokeStyle='#8f7a52';x.lineWidth=50;x.stroke();
    x.strokeStyle='#2f7294';x.lineWidth=43;x.stroke();x.strokeStyle='#3f8db0';x.lineWidth=31;x.stroke();x.strokeStyle='#58a7c7';x.lineWidth=13;x.stroke();}
  for(const b of G.bars)if(b.k==='s'){rp(b.pts);x.strokeStyle=th==='desert'?'#d9bf8a':'#c9b07c';x.lineWidth=128;x.stroke();x.strokeStyle='#2b6688';x.lineWidth=112;x.stroke();x.strokeStyle='#34789e';x.lineWidth=90;x.stroke();x.strokeStyle='#4489b0';x.lineWidth=60;x.stroke();
    x.setLineDash([4,22]);x.strokeStyle='rgba(255,255,255,.3)';x.lineWidth=2;x.stroke();x.setLineDash([]);}
  for(const b of G.bars)if(b.k==='i'){rp(b.pts);x.strokeStyle='#b9c9d6';x.lineWidth=52;x.stroke();x.strokeStyle='#d6e4ee';x.lineWidth=42;x.stroke();x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=14;x.stroke();
    x.strokeStyle='rgba(120,150,175,.5)';x.lineWidth=1;const p=b.pts;for(let i=0;i<p.length-1;i++)for(let k=0;k<3;k++){const t=R(),cx=p[i].x+(p[i+1].x-p[i].x)*t,cy=p[i].y+(p[i+1].y-p[i].y)*t;x.beginPath();x.moveTo(cx-8,cy-6);x.lineTo(cx+2,cy+1);x.lineTo(cx+9,cy-4);x.stroke();}}
  if(th==='desert'){for(let k=0;k<Math.round(W*H/320000)+3;k++){let ox=0,oy=0,ok=false;for(let tries=0;tries<30&&!ok;tries++){ox=60+R()*(W-120);oy=60+R()*(H-120);ok=!G.castles.some(c=>Math.hypot(ox-c.x,oy-c.y)<120);}if(!ok)continue;
    const rr=16+R()*14;x.fillStyle='#8fbf6a';x.beginPath();x.ellipse(ox,oy,rr*1.7,rr*1.2,0,0,7);x.fill();x.fillStyle='#3f8db0';x.beginPath();x.ellipse(ox,oy,rr,rr*.62,0,0,7);x.fill();x.fillStyle='rgba(255,255,255,.35)';x.beginPath();x.ellipse(ox-rr*.3,oy-rr*.15,rr*.35,rr*.12,0,0,7);x.fill();
    for(let q=0;q<4;q++){const an=R()*6.28;palm(x,ox+Math.cos(an)*rr*1.45,oy+Math.sin(an)*rr*1.0,7+R()*3);}}}
  // ridge foothills (under roads)
  for(const b of G.bars)if(b.k==='r'){rp(b.pts);x.strokeStyle='rgba(120,110,85,.45)';x.lineWidth=86;x.stroke();x.strokeStyle='rgba(150,135,100,.5)';x.lineWidth=60;x.stroke();}
  // roads
  const road=e=>{const a=G.castles[e.a],b=G.castles[e.b];x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);};
  x.beginPath();G.edges.forEach(road);x.strokeStyle=PAL.road[0];x.lineWidth=17;x.stroke();x.strokeStyle=PAL.road[1];x.lineWidth=13;x.stroke();
  x.setLineDash([7,5]);x.strokeStyle='rgba(120,90,50,.35)';x.lineWidth=1.4;
  for(const e of G.edges){const a=G.castles[e.a],b=G.castles[e.b];const L=e.len,nx=-(b.y-a.y)/L,ny=(b.x-a.x)/L;for(const s of[-2.6,2.6]){x.beginPath();x.moveTo(a.x+nx*s,a.y+ny*s);x.lineTo(b.x+nx*s,b.y+ny*s);x.stroke();}}
  x.setLineDash([]);
  for(const e of G.edges){const a=G.castles[e.a],b=G.castles[e.b];for(let i=0;i<e.len/18;i++){const t=R();x.fillStyle=R()<.5?'#a88a5c':'#e0c795';x.beginPath();x.ellipse(a.x+(b.x-a.x)*t+(R()-.5)*10,a.y+(b.y-a.y)*t+(R()-.5)*10,1+R(),.8+R()*.7,0,0,7);x.fill();}}
  // bridges and passes
  const hitB=(a,b,pts)=>{for(let i=0;i<pts.length-1;i++){const p=pts[i],q=pts[i+1];const d=(b.x-a.x)*(q.y-p.y)-(b.y-a.y)*(q.x-p.x);if(!d)continue;
    const u=((p.x-a.x)*(q.y-p.y)-(p.y-a.y)*(q.x-p.x))/d,v=((p.x-a.x)*(b.y-a.y)-(p.y-a.y)*(b.x-a.x))/d;if(u>0&&u<1&&v>0&&v<1)return{x:a.x+u*(b.x-a.x),y:a.y+u*(b.y-a.y)};}return null;};
  const passes=[];
  for(const e of G.edges){if(!e.cross)continue;const a=G.castles[e.a],b=G.castles[e.b];let p=null;for(const br of G.bars)if(e.cross==='w'?(br.k==='w'||br.k==='s'):br.k==='r'){p=hitB(a,b,br.pts);if(p)break;}if(!p)continue;
    if(e.cross==='r'){passes.push(p);continue;}
    x.save();x.translate(p.x,p.y);x.rotate(Math.atan2(b.y-a.y,b.x-a.x));
    x.fillStyle='rgba(0,0,0,.3)';x.fillRect(-32,-9,68,24);const wg=x.createLinearGradient(0,-12,0,12);wg.addColorStop(0,'#c49a64');wg.addColorStop(1,'#8f6a3e');x.fillStyle=wg;x.fillRect(-34,-12,68,24);
    x.strokeStyle='#6d4f2c';x.lineWidth=1.2;for(let i=-30;i<=30;i+=5){x.beginPath();x.moveTo(i,-12);x.lineTo(i,12);x.stroke();}
    x.fillStyle='#5e4325';x.fillRect(-35,-14,70,3.5);x.fillRect(-35,10.5,70,3.5);x.restore();}
  // mountain ridges with gaps at the passes
  const mts=[];
  for(const b of G.bars)if(b.k==='r'){for(let i=0;i<b.pts.length-1;i++){const p=b.pts[i],q=b.pts[i+1];const L=Math.hypot(q.x-p.x,q.y-p.y);
      for(let d=0;d<L;d+=13){const mx=p.x+(q.x-p.x)*d/L+(R()-.5)*18,my=p.y+(q.y-p.y)*d/L+(R()-.5)*16;
        if(passes.some(pp=>Math.hypot(pp.x-mx,pp.y-my)<46))continue;mts.push([mx,my,18+R()*16]);}}}
  mts.sort((m1,m2)=>m1[1]-m2[1]);
  for(const [mx,my,sz] of mts){x.fillStyle='rgba(30,30,20,.25)';x.beginPath();x.ellipse(mx+sz*.35,my+2,sz*.9,sz*.25,0,0,7);x.fill();
    x.fillStyle='#8b8272';x.beginPath();x.moveTo(mx-sz*.85,my);x.lineTo(mx,my-sz*1.25);x.lineTo(mx+sz*.85,my);x.closePath();x.fill();
    x.fillStyle='#6d6556';x.beginPath();x.moveTo(mx,my-sz*1.25);x.lineTo(mx+sz*.85,my);x.lineTo(mx+sz*.1,my);x.closePath();x.fill();
    x.fillStyle='#f4f2ec';x.beginPath();x.moveTo(mx-sz*.28,my-sz*.84);x.lineTo(mx,my-sz*1.25);x.lineTo(mx+sz*.3,my-sz*.83);x.lineTo(mx+sz*.1,my-sz*.9);x.lineTo(mx-sz*.08,my-sz*.8);x.closePath();x.fill();}
  for(const p of passes)for(let i=0;i<6;i++){const a=R()*6.28;rock(x,p.x+Math.cos(a)*(26+R()*14),p.y+Math.sin(a)*(18+R()*10),3+R()*4);}
  // rocks near mines
  for(const c of G.castles)if(c.kind==='m')for(let i=0;i<8;i++){const a=R()*6.28,r=34+R()*24;rock(x,c.x+Math.cos(a)*r,c.y+Math.sin(a)*r*.7,3+R()*5);}
  // forests
  const nearSeg=(px,py,m)=>{for(const e of G.edges){const a=G.castles[e.a],b=G.castles[e.b];if(segDist2(px,py,a.x,a.y,b.x,b.y)<m*m)return true;}
    for(const b of G.bars){const r=b.pts;const mm=b.k==='r'?m+40:b.k==='s'?m+60:m+18;for(let i=0;i<r.length-1;i++)if(segDist2(px,py,r[i].x,r[i].y,r[i+1].x,r[i+1].y)<mm*mm)return true;}return false;};
  const trees=[];for(let f=0;f<Math.round(W*H/(th==='desert'?160000:40000));f++){const fx=R()*W,fy=R()*H,n=5+Math.floor(R()*12);for(let i=0;i<n;i++){const px=fx+(R()-.5)*90,py=fy+(R()-.5)*90;
    if(px<6||px>W-6||py<6||py>H-6||nearSeg(px,py,14)||G.castles.some(c=>Math.hypot(px-c.x,py-c.y)<82))continue;trees.push([px,py,5.5+R()*3.5]);}}
  trees.sort((a,b)=>a[1]-b[1]);for(const t of trees){if(th==='winter')pine(x,t[0],t[1],t[2]);else if(th==='desert'){if(R()<0.5)cactus(x,t[0],t[1],t[2]*0.9);else rock(x,t[0],t[1],t[2]*0.7);}else tree(x,t[0],t[1],t[2],R);}
  x.strokeStyle=PAL.border;x.lineWidth=4;x.strokeRect(2,2,W-4,H-4);
  return cn;
}
// ---------- unit figures (art units, mirrored by facing) ----------
function drawUnit(x,px,py,k,col,t,dir,u,bearer,act,v=0){
  if(u===1){soldier(x,px,py,k,col,t,dir,bearer,v);return;}
  x.save();x.translate(px,py);x.scale(k*dir,k);
  if(u===0){ // militia: no armour, farm tools
    const bob=Math.abs(Math.sin(t))*2.2,leg=Math.sin(t)*3;
    x.fillStyle='rgba(20,30,10,.3)';x.beginPath();x.ellipse(2,1,5.5,2.2,0,0,7);x.fill();
    x.strokeStyle='#4a3a2a';x.lineWidth=2.2;x.lineCap='round';x.beginPath();x.moveTo(-1.5,-7-bob*.3);x.lineTo(-1.5+leg*.6,0);x.moveTo(1.5,-7-bob*.3);x.lineTo(1.5-leg*.6,0);x.stroke();
    x.fillStyle='#9c8a6c';x.beginPath();x.moveTo(-4.5,-7-bob);x.lineTo(-3.5,-16-bob);x.lineTo(3.5,-16-bob);x.lineTo(4.5,-7-bob);x.closePath();x.fill();
    x.fillStyle=col;x.fillRect(-4.4,-11.5-bob,8.8,2.6);
    x.fillStyle=SKIN[v%4];x.beginPath();x.arc(0,-19.5-bob,3.2,0,7);x.fill();
    x.fillStyle=['#5a4028','#2e2418','#8a6a3a','#6b6b6b'][v%4];x.beginPath();x.arc(0,-20.6-bob,3.4,Math.PI*1.1,-0.1);x.fill();
    const sw=act?Math.sin(t*1.2)*0.5:0;x.save();x.translate(3,-11-bob);x.rotate(-0.35+sw);x.strokeStyle='#6b5a44';x.lineWidth=1.3;x.beginPath();x.moveTo(0,4);x.lineTo(0,-20);x.stroke();
    if(v%2){x.strokeStyle='#9aa0a6';x.lineWidth=1;x.beginPath();x.moveTo(-2,-20);x.lineTo(-2,-25);x.moveTo(0,-20);x.lineTo(0,-26);x.moveTo(2,-20);x.lineTo(2,-25);x.moveTo(-2,-20);x.lineTo(2,-20);x.stroke();}
    else{x.fillStyle='#9aa0a6';x.beginPath();x.moveTo(0,-20);x.lineTo(4,-23);x.lineTo(4,-16);x.closePath();x.fill();}x.restore();
  }else if(u===9){ // (unused)
    const bob=act?0:Math.abs(Math.sin(t))*2,leg=act?0:Math.sin(t)*3;
    x.fillStyle='rgba(20,30,10,.3)';x.beginPath();x.ellipse(2,1,6,2.4,0,0,7);x.fill();
    x.strokeStyle='#3a2f24';x.lineWidth=2.2;x.lineCap='round';x.beginPath();x.moveTo(-1.5,-7-bob*.3);x.lineTo(-1.5+leg*.6,0);x.moveTo(1.5,-7-bob*.3);x.lineTo(1.5-leg*.6,0);x.stroke();
    x.fillStyle='#6b5234';x.fillRect(-6,-17-bob,3,9); // quiver
    x.fillStyle=col;x.beginPath();x.moveTo(-4.5,-7-bob);x.lineTo(-3.5,-16-bob);x.lineTo(3.5,-16-bob);x.lineTo(4.5,-7-bob);x.closePath();x.fill();
    x.fillStyle=SKIN[v%4];x.beginPath();x.arc(0,-19.5-bob,3.2,0,7);x.fill();
    x.fillStyle=(v>>2)%2?shade(col,-.35):'#5b4a36';x.beginPath();x.arc(0,-20.5-bob,3.9,Math.PI*1.05,-0.05);x.lineTo(-3.5,-17-bob);x.fill(); // hood
    const draw=act?Math.max(0,Math.sin(t*2.2))*3:0;
    x.strokeStyle='#5e4325';x.lineWidth=1.6;x.beginPath();x.arc(4,-13-bob,8,-1.25,1.25);x.stroke();
    x.strokeStyle='rgba(240,235,220,.9)';x.lineWidth=.7;x.beginPath();x.moveTo(4+8*Math.cos(-1.25),-13-bob+8*Math.sin(-1.25));x.lineTo(4-draw,-13-bob);x.lineTo(4+8*Math.cos(1.25),-13-bob+8*Math.sin(1.25));x.stroke();
  }else if(u===2){ // knight
    const g=act?t*1.6:t*1.4,leg=Math.sin(g)*4,bob=Math.abs(Math.sin(g))*1.5;
    x.fillStyle='rgba(20,30,10,.3)';x.beginPath();x.ellipse(1,1,13,3.4,0,0,7);x.fill();
    x.strokeStyle='#4a3220';x.lineWidth=2.4;x.lineCap='round';x.beginPath();
    x.moveTo(-8,-8-bob);x.lineTo(-8+leg,0);x.moveTo(-5,-8-bob);x.lineTo(-5-leg,0);x.moveTo(6,-8-bob);x.lineTo(6-leg,0);x.moveTo(9,-8-bob);x.lineTo(9+leg,0);x.stroke();
    const HC=['#7a5230','#5a3a22','#9a7650','#3a2a1e','#c9b79a'][v%5];x.fillStyle=HC;x.beginPath();x.ellipse(0,-11-bob,12,5.5,0,0,7);x.fill();
    x.beginPath();x.moveTo(8,-14-bob);x.lineTo(14,-22-bob);x.lineTo(18,-20-bob);x.lineTo(12,-11-bob);x.closePath();x.fill();
    if(v===15){x.fillStyle='#c0392b';x.beginPath();x.ellipse(0,-34-bob,1.5,3.2,-0.3,0,7);x.fill();}
    x.fillStyle='#3a2616';x.beginPath();x.moveTo(-12,-12-bob);x.quadraticCurveTo(-17,-9-bob,-15,-4-bob);x.lineTo(-11,-10-bob);x.fill();
    x.fillStyle='#a7adb3';x.beginPath();x.moveTo(8,-14-bob);x.lineTo(14,-22-bob);x.lineTo(16.5,-21-bob);x.lineTo(11,-12-bob);x.closePath();x.fill(); // chanfron
    x.fillStyle=col;x.fillRect(-9,-15-bob,15,8); // caparison
    x.fillStyle=shade(col,-.3);x.fillRect(-9,-8-bob,15,1.5);x.fillStyle='#f1ede4';x.fillRect(-3,-14-bob,2,6);
    x.fillStyle=col;x.beginPath();x.moveTo(-3,-15-bob);x.lineTo(-2,-25-bob);x.lineTo(4,-25-bob);x.lineTo(4,-15-bob);x.closePath();x.fill();
    x.fillStyle='#b9bec4';x.fillRect(-2.6,-25-bob,7.2,10); // breastplate
    x.fillStyle='#9aa0a6';x.beginPath();x.moveTo(-2.4,-25.5-bob);x.lineTo(-2.4,-31-bob);x.quadraticCurveTo(1,-34-bob,4.4,-31-bob);x.lineTo(4.4,-25.5-bob);x.closePath();x.fill(); // great helm
    x.fillStyle='#2e2a24';x.fillRect(0,-29.5-bob,4.4,1);
    x.fillStyle=v%3?col:'#f1ede4';x.beginPath();x.ellipse(0.5,-35.5-bob,1.6,3.4,-0.3,0,7);x.fill();
    const lx=act?Math.sin(t*3)*3:0;x.strokeStyle='#6b5a44';x.lineWidth=1.5;x.beginPath();x.moveTo(-4,-18-bob);x.lineTo(20+lx,-30-bob);x.stroke();
    if(bearer){x.fillStyle=col;x.beginPath();x.moveTo(16+lx,-28-bob);x.lineTo(10+lx,-33-bob);x.lineTo(15+lx,-31-bob);x.fill();}
  }else{ // siege ram
    const push=act?Math.max(0,Math.sin(t*1.5))*4:0,roll=t*0.8;
    x.fillStyle='rgba(20,30,10,.3)';x.beginPath();x.ellipse(0,1,15,3.6,0,0,7);x.fill();
    x.fillStyle='#8f6a3e';x.fillRect(-13,-10,26,7);
    x.fillStyle='#5e4325';x.beginPath();x.moveTo(-15,-10);x.lineTo(0,-22);x.lineTo(15,-10);x.closePath();x.fill();
    x.fillStyle=col;x.beginPath();x.moveTo(-9,-13);x.lineTo(0,-20);x.lineTo(9,-13);x.closePath();x.fill();
    x.fillStyle='#6b5234';x.fillRect(-4+push,-9,22,4);x.fillStyle='#6e6a62';x.beginPath();x.arc(18+push,-7,3,0,7);x.fill();
    for(const wx of[-9,0,9]){x.fillStyle='#4a3220';x.beginPath();x.arc(wx,-2,3.2,0,7);x.fill();x.strokeStyle='#a88a5c';x.lineWidth=.8;x.beginPath();x.moveTo(wx+Math.cos(roll)*3,-2+Math.sin(roll)*3);x.lineTo(wx-Math.cos(roll)*3,-2-Math.sin(roll)*3);x.stroke();}
  }
  x.restore();
}
function drawCorpse(x,px,py,k,col,u,flip){
  x.save();x.translate(px,py);x.scale(k*(flip?-1:1),k);
  if(u===2){x.fillStyle='#6a4628';x.beginPath();x.ellipse(0,-4,12,4.5,0.1,0,7);x.fill();x.fillStyle=col;x.fillRect(-5,-8,9,5);x.strokeStyle='#4a3220';x.lineWidth=2;x.beginPath();x.moveTo(-8,-1);x.lineTo(-13,2);x.moveTo(7,-1);x.lineTo(12,3);x.stroke();}
  else if(u===3){x.fillStyle='#6b5234';x.save();x.rotate(0.3);x.fillRect(-12,-6,11,3);x.restore();x.fillRect(0,-4,12,3);x.fillStyle=col;x.beginPath();x.moveTo(-6,-2);x.lineTo(0,-8);x.lineTo(4,-2);x.fill();x.fillStyle='#4a3220';x.beginPath();x.arc(8,0,3,0,7);x.fill();}
  else{x.rotate(1.35);x.fillStyle=col;x.fillRect(-4,-16,8,10);x.fillStyle='#e9c49a';x.beginPath();x.arc(0,-19,3.2,0,7);x.fill();x.strokeStyle='#3a2f24';x.lineWidth=2;x.beginPath();x.moveTo(-1.5,-6);x.lineTo(-2,0);x.moveTo(1.5,-6);x.lineTo(2,0);x.stroke();}
  x.restore();}

function drawTower(x,t,col,now,px){
  const X=t.x,Y=t.y,r=6.5,h=t.bt>0?11:22;
  x.fillStyle='rgba(20,30,10,.3)';x.beginPath();x.ellipse(X+r*.9,Y+1.5,r*1.5,r*.55,-.2,0,7);x.fill();
  const g=x.createLinearGradient(X-r,0,X+r,0);g.addColorStop(0,STONE[0]);g.addColorStop(.5,STONE[1]);g.addColorStop(1,STONE[2]);x.fillStyle=g;
  x.beginPath();x.moveTo(X-r,Y-h);x.lineTo(X-r,Y);x.ellipse(X,Y,r,r*.45,0,Math.PI,0,true);x.lineTo(X+r,Y-h);x.closePath();x.fill();
  x.strokeStyle='rgba(60,55,45,.35)';x.lineWidth=.5;for(let yy=Y-h+4;yy<Y;yy+=4){x.beginPath();x.ellipse(X,yy,r,r*.45,0,.15,Math.PI-.15);x.stroke();}
  if(t.bt>0){x.strokeStyle='#8a6a40';x.lineWidth=.9;for(const dx of[-r-2,r+2]){x.beginPath();x.moveTo(X+dx,Y+1);x.lineTo(X+dx,Y-h-9);x.stroke();}
    for(let yy=Y-2;yy>Y-h-9;yy-=5){x.beginPath();x.moveTo(X-r-2,yy);x.lineTo(X+r+2,yy-2);x.stroke();}return;}
  x.fillStyle=STONE[0];for(let k=-2;k<=2;k++){x.fillRect(X+k*2.6-1,Y-h-2.5,2,2.5);}
  x.fillStyle='#2e2a24';x.fillRect(X-.7,Y-h*.62,1.4,3.5);
  const rg=x.createLinearGradient(X-r,0,X+r,0);rg.addColorStop(0,shade(col,.35));rg.addColorStop(.55,col);rg.addColorStop(1,shade(col,-.4));x.fillStyle=rg;
  x.beginPath();x.moveTo(X-r*1.15,Y-h-2.5);x.lineTo(X,Y-h-2.5-r*1.9);x.lineTo(X+r*1.15,Y-h-2.5);x.closePath();x.fill();
  drawFlag(x,X,Y-h-2.5-r*1.9,0.45,col,now/1000,false);
  if(t.hp<TOWER_HP*0.98){const w=16,f=Math.max(0,t.hp/TOWER_HP);x.fillStyle='rgba(0,0,0,.5)';x.fillRect(X-w/2,Y+4,w,2.6);x.fillStyle=f>0.4?'#5cc06a':'#e0574c';x.fillRect(X-w/2+.3,Y+4.3,(w-.6)*f,2);}
}

function drawWonder(x,X,Y,stage,prog,col,now,done){
  const H=12+stage*9+(done?6:0),w=13;
  x.fillStyle='rgba(20,30,10,.3)';x.beginPath();x.ellipse(X+6,Y+2,w*1.4,4.5,0,0,7);x.fill();
  // stepped stone base and gilded obelisk
  x.fillStyle='#cfc4ad';x.fillRect(X-w,Y-5,w*2,5);x.fillStyle='#bdb09a';x.fillRect(X-w*.8,Y-9,w*1.6,4);
  if(stage>0){const g=x.createLinearGradient(X-6,0,X+6,0);g.addColorStop(0,'#f6dc8a');g.addColorStop(.5,'#e3b43c');g.addColorStop(1,'#a87c1a');x.fillStyle=g;
    x.beginPath();x.moveTo(X-6,Y-9);x.lineTo(X-4,Y-9-H);x.lineTo(X+4,Y-9-H);x.lineTo(X+6,Y-9);x.closePath();x.fill();
    x.strokeStyle='rgba(120,80,10,.5)';x.lineWidth=.6;for(let k=1;k<stage;k++){const yy=Y-9-k*9;x.beginPath();x.moveTo(X-5.5+k*.4,yy);x.lineTo(X+5.5-k*.4,yy);x.stroke();}}
  if(done){x.fillStyle='#fff3c4';x.beginPath();x.moveTo(X-4,Y-9-H);x.lineTo(X,Y-17-H);x.lineTo(X+4,Y-9-H);x.closePath();x.fill();
    const t=now/1000;x.save();x.globalAlpha=.25+.15*Math.sin(t*2);x.fillStyle='#ffe08a';for(let k=0;k<6;k++){const an=t*.4+k*Math.PI/3;x.beginPath();x.moveTo(X,Y-13-H);x.lineTo(X+Math.cos(an)*26-2,Y-13-H+Math.sin(an)*26);x.lineTo(X+Math.cos(an)*26+2,Y-13-H+Math.sin(an)*26);x.closePath();x.fill();}x.restore();
    drawFlag(x,X,Y-17-H,0.4,col,now/1000,false);}
  else if(prog>0||stage<WONDER_STAGES){ // scaffolding on the stage being built
    const top=Y-9-H-9*Math.max(0.15,prog);x.strokeStyle='#8a6a40';x.lineWidth=.8;for(const dx of[-8,8]){x.beginPath();x.moveTo(X+dx,Y-5);x.lineTo(X+dx*.6,top);x.stroke();}
    for(let yy=Y-8;yy>top;yy-=5){x.beginPath();x.moveTo(X-8+(Y-yy)*.06,yy);x.lineTo(X+8-(Y-yy)*.06,yy-1.5);x.stroke();}}
}

function pine(x,px,py,s){x.fillStyle='rgba(40,60,80,.22)';x.beginPath();x.ellipse(px+s*.5,py+s*.35,s*.9,s*.4,0,0,7);x.fill();x.fillStyle='#4a3424';x.fillRect(px-s*.1,py-s*.2,s*.2,s*.5);
  for(let k=0;k<3;k++){const w=s*(0.95-k*0.22),y0=py-s*0.15-k*s*0.55;x.fillStyle='#24513a';x.beginPath();x.moveTo(px-w,y0);x.lineTo(px,y0-s*0.9);x.lineTo(px+w,y0);x.closePath();x.fill();
    x.fillStyle='#f4f8fb';x.beginPath();x.moveTo(px-w*0.45,y0-s*0.45);x.lineTo(px,y0-s*0.9);x.lineTo(px+w*0.45,y0-s*0.45);x.lineTo(px+w*0.15,y0-s*0.55);x.lineTo(px-w*0.1,y0-s*0.42);x.closePath();x.fill();}}
function palm(x,px,py,s){x.strokeStyle='#7a5a34';x.lineWidth=s*0.22;x.lineCap='round';x.beginPath();x.moveTo(px,py);x.quadraticCurveTo(px+s*.3,py-s*.8,px+s*.15,py-s*1.6);x.stroke();
  x.strokeStyle='#3f7d3a';x.lineWidth=s*0.18;for(const an of[-2.6,-1.9,-1.2,-0.5,0.2]){x.beginPath();x.moveTo(px+s*.15,py-s*1.6);x.quadraticCurveTo(px+s*.15+Math.cos(an)*s*.7,py-s*1.6+Math.sin(an)*s*.5-s*.2,px+s*.15+Math.cos(an)*s*1.1,py-s*1.6+Math.sin(an)*s*.8);x.stroke();}}
function cactus(x,px,py,s){x.fillStyle='rgba(90,60,30,.25)';x.beginPath();x.ellipse(px+s*.3,py+s*.1,s*.6,s*.2,0,0,7);x.fill();x.strokeStyle='#4f7d3e';x.lineCap='round';x.lineWidth=s*0.32;
  x.beginPath();x.moveTo(px,py);x.lineTo(px,py-s*1.5);x.moveTo(px,py-s*.7);x.lineTo(px-s*.45,py-s*.8);x.lineTo(px-s*.45,py-s*1.15);x.moveTo(px,py-s*.95);x.lineTo(px+s*.4,py-s*1.0);x.lineTo(px+s*.4,py-s*1.3);x.stroke();}

</script>
<script>
// ===== Keepfall UI + networking =====

const clean=s=>String(s||'').replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u2028-\u202e\u2060-\u206f\ufeff]/g,'').trim().slice(0,14);
let myName=clean(store.get('hf-name'))||('Warden'+Math.floor(10+Math.random()*89));
$('#name').value=myName;
$('#name').addEventListener('input',e=>{myName=clean(e.target.value)||'Player';store.set('hf-name',myName);});

let prevLook=[],terrain=null,pings=[],seen=[],fogData=null,armedAb=-1,stats=null,lastPourSent='';
let ROOM=null,PHASE='menu',CFG=null,G=null,mySlot=0,paused=false,sel=-1,drag=null,fx=[],prevOwner=[],outShown=false,overShown=false;
const NET={mode:'local',nr:null,code:null,myPeer:null,lastSeq:{},seq:0,cmds:[],unsub:[],gid:null,hadHost:false,lastAd:''};

// ---------- screens ----------
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id==='s-'+id));if(id==='game')resize();}

function overlay(html,binds){const ov=$('#ov');$('#ov-card').innerHTML=html;ov.hidden=false;for(const k in binds){const el=$('#ov-card [data-a="'+k+'"]');if(el)el.onclick=binds[k];}}

let toastT=0;function toast(t,ms=3200){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),ms);}

$('#b-help').onclick=()=>overlay(`<h3>How to play</h3><div class="help">
<p><b>Protect your capital.</b> Its flag and troop plaque carry a star. If it falls, you're out. In team games a team loses when every capital has fallen.</p>
<p><b>Real soldiers.</b> Every troop that leaves a castle is a soldier on the map. Soldiers that meet enemies fight them hand to hand, and bigger groups win. A thin trickle gets picked off, so strike with a solid block.</p>
<p><b>Move troops.</b> Hold a road next to your castle and soldiers gather in a block outside the gate. Let go and they march together. How many can gather depends on the castle's level. You can also drag outward from the castle. Slide onto the far castle before letting go to lock a steady route instead, and quick-tap that road to stop it. Routes into your own castles pause while that castle is full, so no soldiers are wasted. A quick tap sends a small squad.</p>
<p><b>Unit types.</b> Every castle trains free militia. A Barracks lets it train spearmen (2 gold each) and Stables knights (5 gold each); pick what it trains in the castle panel. Spearmen beat knights, knights crush militia, and both outclass militia. The Send chips choose which types march out.</p>
<p><b>Hiring.</b> Any castle can hire 10 soldiers for gold (spearmen where there's a Mercenary Camp). Each hire costs more than the last, and prices ease back over time.</p>
<p><b>Veterans.</b> Soldiers who kill enemies rank up (gold chevrons), gaining health and damage. Ranks are remembered when they return to a castle.</p>
<p><b>Take castles.</b> Soldiers at an enemy castle attack the walls while the garrison shoots back. Owned castles defend 35% better, more with Moat walls, on hills, or at a capital. The castle falls when its garrison hits zero. Captured castles drop one level, losing buildings that no longer fit.</p>
<p><b>Trade routes.</b> Two of your Markets linked by an unbroken chain of your own castles earn bonus gold, and longer links pay more. Lose a castle in the chain and the route breaks.</p>
<p><b>Neutrals.</b> Villages near your capital are easy pickings. Further out they get sturdier, and the heart of the map is held by walled fortresses guarded by watchtowers. Walls shrug off attackers without siege equipment, so you need Siegecraft research or soldiers from a Workshop castle, and Army upgrades help a lot. Fortresses pay rich loot and keep their walls for you. Mines earn plenty of gold. Neutrals heal if you stop attacking them.</p>
<p><b>Build up.</b> Tap your castle to switch between Recruit (troops) and Tax (nine times the gold, slower growth), raise its level (up to 5, capitals up to 6) and fill its building slots: one per level, four from level 5. At level 3 a castle can take a permanent path: Bastion (much sturdier), Trade city (double gold) or Barracks town (fast, cheap troops). A Mercenary Camp lets you hire soldiers for gold. Your capital's level and Granaries set your army cap. Castles cut off from your capital grow slowly and earn nothing.</p>
<p><b>Research and abilities.</b> Research runs one project at a time, or pay extra to finish instantly. Army upgrades make a whole unit type 20–35% stronger per tier, which decides most battles. Each branch ends in a powerful capstone tech, and finishing any capstone opens endless Mastery levels. Spells are unlocked in the Arcane research branch, cost gold and need to recharge: Fire Rain scorches every enemy soldier in an area after a short warning, Breach knocks a castle's walls down for 20 seconds, and Scout reveals an area.</p>
<p><b>Road towers.</b> Build a stone tower on a road from the castle panel. It shoots anyone walking past and shrugs off most blows; a Workshop's soldiers break towers faster.</p>
<p><b>Fog, night and terrain.</b> You only see near your castles and soldiers, and less at night. Rivers are crossed at bridges and mountain ridges at passes. Castles on hills defend 30% better.</p>
<p><b>Win</b> by taking every rival capital, or by building a Wonder at your capital (level 3 or higher): five stages of 800 gold, then hold your capital for 4 minutes. Everyone is warned, and attacks on your capital roll the timer back.</p></div>
<button class="btn primary" data-a="ok">Got it</button>`,{ok:closeOv});

// ---------- campaign ----------
const MISSIONS=[
 {t:'The first banner',d:'Learn to march, build and conquer against a sleepy neighbour.',mt:0,ms:0,bots:[{d:0,pe:2}],tut:true,delay:150},
 {t:'River crossing',d:'Two rivers, few bridges. Hold the crossings and push through.',mt:1,ms:0,bots:[{d:1,pe:0}]},
 {t:'Lance and pike',d:'Two rivals with very different habits. Spearmen stop knights; knights scatter militia.',mt:0,ms:1,bots:[{d:0,pe:1},{d:1,pe:3}]},
 {t:'The pass',d:'A turtle guards the only ways through the mountains. A Workshop helps crack its towers.',mt:3,ms:1,bots:[{d:2,pe:2}]},
 {t:'Islands of gold',d:'Fight beside an ally across four islands joined by bridges.',mt:2,ms:1,bots:[{d:1,pe:0,t:1},{d:1,pe:1,t:2},{d:1,pe:3,t:2}],you:1},
 {t:'Kingslayer',d:'Three hard warlords. Only one crown will remain.',mt:0,ms:2,bots:[{d:2,pe:1},{d:2,pe:0},{d:2,pe:2}]}];
let CAMP=null;
function campDone(){return +(store.get('hf-camp')||0);}
function renderCamp(){const box=$('#missions');box.innerHTML='';const done=campDone();
  MISSIONS.forEach((m,i)=>{const b=document.createElement('button');b.className='mission';b.disabled=i>done;
    b.innerHTML='<span class="n"></span><span class="t"><b></b><small></small></span><span class="st"></span>';
    b.querySelector('.n').textContent=i+1;b.querySelector('b').textContent=m.t;b.querySelector('small').textContent=i>done?'Locked. Win the previous mission first.':m.d;b.querySelector('.st').textContent=i<done?'Won ✓':'';
    b.onclick=()=>startMission(i);box.appendChild(b);});}
$('#b-camp').onclick=()=>{leaveNet();renderCamp();show('camp');};
function startMission(i){const m=MISSIONS[i];leaveNet();DAILY=null;NET.mode='local';
  const slots=[];for(let k=0;k<8;k++)slots.push({k:'x',n:'',t:0,d:1,p:'',pe:0});
  slots[0]={k:'h',n:myName,t:m.you||0,d:1,p:'host',pe:0};m.bots.forEach((b,k)=>{slots[k+1]={k:'b',n:'',t:b.t||0,d:b.d,p:'',pe:b.pe};});
  CFG={slots,ms:m.ms,sp:1,mt:m.mt,gid:0,fixedSeed:7001+i*131,botDelay:m.delay||0};CAMP={i,tut:!!m.tut,step:0};startGame();
  setTimeout(()=>overlay(`<h3>${i+1}. </h3><p class="sub" data-md></p><button class="btn primary" data-a="go">To battle</button>`,{go:closeOv}),50);
  setTimeout(()=>{const hh=$('#ov-card h3');if(hh)hh.textContent=(i+1)+'. '+m.t;const md=$('#ov-card [data-md]');if(md)md.textContent=m.d;},60);}
// tutorial steps: text plus the condition that completes each one
const TUT=[
 {h:'Your capital',p:'The castle with the star is your capital. Lose it and you lose. Tap it to open its panel.',ok:()=>sel===G.home[mySlot]},
 {h:'Gather an army',p:'Close the panel. Hold your finger on the road leading out of your castle: soldiers gather at the gate. Let go and they march.',ok:()=>G.sol.some(s=>s.o===mySlot&&s.st===0)},
 {h:'Take a castle',p:'At an enemy or neutral castle your soldiers attack the walls while the garrison shoots back. When the garrison hits zero, it is yours. Take one.',ok:()=>G.castles.filter(c=>c.owner===mySlot).length>=2},
 {h:'Build up',p:'Tap a castle and add a building, raise its level, or switch a safe castle to Tax for gold.',ok:()=>G.castles.some(c=>c.owner===mySlot&&(c.build||c.b.length||c.tax))},
 {h:'Better troops',p:'Militia are weak. Build a Barracks to train spearmen or Stables for knights, then use the Send chips at the bottom to pick who marches. Tap ? to learn the counters.',ok:()=>G.castles.some(c=>c.owner===mySlot&&(c.b.some(b=>b===1||b===4)||c.build&&[2,5].includes(c.build.k)))},
 {h:'Research',p:'Tap Research and start a project. Army upgrades make every soldier of a type stronger, and Siegecraft breaks walled fortresses, and the Arcane branch unlocks spells. Drilled Militia is a strong first pick.',ok:()=>G.pl[mySlot].res||G.pl[mySlot].cur>=0},
 {h:'Road towers',p:'In a castle panel, build a tower on a road facing the enemy. It shoots anyone walking past.',ok:()=>G.tw.some(t=>t.o===mySlot)},
 {h:'Victory',p:'Gather a big mixed army and take the enemy capital, the castle with the star. Your rival wakes up soon.',ok:()=>false}];
function tutTick(){const el=$('#tut');if(!CAMP||!CAMP.tut||!G||G.over){if(!el.hidden)el.hidden=true;return;}
  const st=TUT[CAMP.step];if(!st){el.hidden=true;return;}if(st.ok()){CAMP.step++;tutTick();return;}
  el.hidden=false;$('#tut-h').textContent=(CAMP.step+1)+'/'+TUT.length+'  '+st.h;$('#tut-p').textContent=st.p;}
setInterval(tutTick,400);
$('#tut-skip').onclick=()=>{if(CAMP)CAMP.tut=false;$('#tut').hidden=true;};

// ---------- network bootstrap ----------
(async()=>{
  try{if(window.claude&&typeof claude.use==='function')ROOM=await claude.use('room');}catch(e){ROOM=null;}

})();

}

// ---------- setup / lobby ----------
function mkSlots(online){const s=[];for(let i=0;i<8;i++){
  if(i===0)s.push({k:'h',n:myName,t:0,d:1,p:'host',pe:0});
  else if(online)s.push(i<4?{k:'o',n:'',t:0,d:1,p:''}:{k:'x',n:'',t:0,d:1,p:''});

function botName(i,d){return 'Bot '+(i+1)+' ('+DIFF[d]+')';}

$('#b-local').onclick=()=>{leaveNet();CAMP=null;DAILY=null;NET.mode='local';CFG={wonder:CFG?.wonder??1,gold:CFG?.gold??30,fog:CFG?.fog??1,neut:CFG?.neut??1,slots:mkSlots(false),ms:CFG?.ms??1,sp:CFG?.sp??1,mt:CFG?.mt??-1,gid:0};PHASE='lobby';
  $('#setup-title').textContent='New game';$('#code-box').hidden=true;renderSetup();show('setup');};
$('#b-host').onclick=async()=>{
  if(!ROOM)return;leaveNet();

  CFG={wonder:CFG?.wonder??1,gold:CFG?.gold??30,fog:CFG?.fog??1,neut:CFG?.neut??1,slots:mkSlots(true),ms:CFG?.ms??1,sp:CFG?.sp??1,mt:CFG?.mt??-1,gid:0};PHASE='lobby';
  $('#setup-title').textContent='Online lobby';$('#code').textContent=code;$('#code-box').hidden=false;

function toastMenu(t){$('#net-note').textContent=t;}

function renderSetup(){
  const box=$('#slots');box.innerHTML='';const online=NET.mode==='host';
  CFG.slots.forEach((s,i)=>{
    const row=document.createElement('div');row.className='slot'+(s.k==='x'?' off':'');
    const hex=document.createElement('span');hex.className='hex';hex.style.setProperty('--c',COLORS[i]);row.appendChild(hex);
    const remote=s.k==='h'&&i!==0;
    if(i===0||remote){const w=document.createElement('span');w.className='who';w.textContent=i===0?myName:(s.n||'Player');
      const sm=document.createElement('small');sm.textContent=i===0?'you':'online';w.appendChild(sm);row.appendChild(w);
      if(remote){const k=document.createElement('button');k.className='kick';k.textContent='×';k.setAttribute('aria-label','Remove player');
        k.onclick=()=>{s.k='x';s.p='';s.n='';renderSetup();pushState();};row.appendChild(k);}}
    else{const sl=document.createElement('select');sl.setAttribute('aria-label','Slot '+(i+1));
      const opts=[];if(online)opts.push(['o','Open for a player']);opts.push(['b0','Bot, easy'],['b1','Bot, normal'],['b2','Bot, hard'],['x','Closed']);
      for(const [v,l] of opts){const o=document.createElement('option');o.value=v;o.textContent=l;sl.appendChild(o);}
      sl.value=s.k==='b'?'b'+s.d:s.k;
      sl.onchange=()=>{const v=sl.value;if(v[0]==='b'){s.k='b';s.d=+v[1];}else s.k=v;renderSetup();pushState();};
      row.appendChild(sl);
      if(s.k==='b'){const pe=document.createElement('select');pe.className='pe';pe.setAttribute('aria-label','Bot style');
        PERS.forEach((l,v)=>{const o=document.createElement('option');o.value=v;o.textContent=l;pe.appendChild(o);});pe.value=s.pe|0;pe.onchange=()=>{s.pe=+pe.value;pushState();};row.appendChild(pe);}}
    if(s.k!=='x'){const t=document.createElement('select');t.className='team';t.setAttribute('aria-label','Team');
      TEAMS.forEach((l,v)=>{const o=document.createElement('option');o.value=v;o.textContent=l;t.appendChild(o);});
      t.value=s.t;t.onchange=()=>{s.t=+t.value;pushState();validate();};row.appendChild(t);}
    box.appendChild(row);
  });
  const mt=$('#mt');if(mt){mt.value=String(CFG.mt??-1);mt.onchange=()=>{CFG.mt=+mt.value;pushState();};}
  document.querySelectorAll('.seg').forEach(seg=>{const k=seg.dataset.opt;seg.querySelectorAll('button').forEach(b=>{
    b.setAttribute('aria-pressed',String(+b.dataset.v===CFG[k]));b.onclick=()=>{CFG[k]=+b.dataset.v;renderSetup();pushState();};});});
  validate();
}
function validate(){
  const act=CFG.slots.filter(s=>s.k==='h'||s.k==='b');
  const teams=new Set(CFG.slots.map((s,i)=>(s.k==='h'||s.k==='b')?(s.t?'T'+s.t:'S'+i):null).filter(Boolean));
  const open=CFG.slots.filter(s=>s.k==='o').length;
  let m='';if(teams.size<2)m='You need at least two sides to fight.';
  else if(NET.mode==='host')m=open?`${act.length} ready, ${open} open slot${open>1?'s':''} (open slots close when you start)`:`${act.length} ready`;
  $('#setup-msg').textContent=m;$('#b-start').disabled=teams.size<2;
}
$('#b-start').onclick=()=>startGame();

function worldSize(o,ms){const k=ms===3?1.3:1;return o==='l'?[1600*k,1000*k]:[1000*k,1600*k];}
function startGame(){
  CFG.slots.forEach(s=>{if(s.k==='o'){s.k='x';s.p='';}});
  CFG.slots[0].n=myName;
  CFG.seed=CFG.fixedSeed||((Math.random()*2**31)>>>0);CFG.gid=(CFG.gid|0)+1;
  const st=$('#stage');CFG.o=(window.innerWidth>window.innerHeight*1.15)?'l':'p';
  const [W,H]=worldSize(CFG.o,CFG.ms);CFG.opts={wonder:CFG.wonder??1,gold:CFG.gold??30,fog:CFG.fog??1,neut:CFG.neut??1};
  G=newGame({seed:CFG.seed,slots:CFG.slots,W,H,ms:CFG.ms,sp:CFG.sp,mt:CFG.mt??-1,botDelay:CFG.botDelay||0,opts:CFG.opts});
  mySlot=0;beginPlay();
  pushState();
}
function beginPlay(){
  PHASE='play';paused=false;SPEEDX=1;sel=-1;drag=null;fx=[];prevOwner=G.castles.map(c=>c.owner);prevLook=G.castles.map(c=>c.lv*8+c.b.length);outShown=false;overShown=false;closeOv();
  G.names=castleNames(G.castles.length,G.terrainSeed);terrain=null;SPR.clear();pings=[];armedAb=-1;fogData=null;seen=G.castles.map(()=>null);
  stats={hist:[],peak:new Array(8).fill(0),taken:new Array(8).fill(0),t:0};gesture=null;pourStop();
  updatePanel();show('game');startSim();resetCam(true);initWeather();resetMix();
  if(NET.mode!=='replay'){$('#s-game').classList.remove('replay');recStart();}
  syncSpeedUi();
  if(mySlot>=0){setTimeout(()=>toast('Hold a road beside your castle to gather soldiers at the gate. Let go to march.',5000),400);
    setTimeout(()=>{if(G&&!G.over)toast('Tap your castle to set Tax or Recruit, level it up and add buildings. Guard your capital.',5000);},11000);}

// ---------- host networking ----------
function encodeL(){return{s:CFG.slots.map(s=>[s.k,s.n||'',s.t|0,s.d|0,s.p||'',s.pe|0]),sd:CFG.seed|0,ms:CFG.ms,sp:CFG.sp,mt:CFG.mt??-1,op:CFG.opts||{wonder:CFG.wonder??1,gold:CFG.gold??30,fog:CFG.fog??1,neut:CFG.neut??1},o:CFG.o||'p',gid:CFG.gid|0,st:PHASE};}
function pushState(){
  if(NET.mode!=='host'||!NET.nr)return;
  const L=encodeL();let g=null;
  if(PHASE!=='lobby'&&G){g=encode(G,3850-JSON.stringify(L).length-60);}
  NET.nr.presence({r:'h',n:myName,L,g}).catch(()=>{});
  const ad={h:NET.code,n:myName,f:CFG.slots.filter(s=>s.k==='o').length,st:PHASE==='lobby'?'lobby':'play'};
  const ads=JSON.stringify(ad);if(ads!==NET.lastAd&&ROOM){NET.lastAd=ads;ROOM.presence(ad).catch(()=>{});}
}
function onHostPeers({peers}){
  if(NET.mode!=='host')return;
  const clients=peers.filter(p=>!p.sameTab&&p.presence&&p.presence.r==='c'&&!p.presence.spec);
  const ids=new Set(clients.map(p=>p.peer));
  if(PHASE==='lobby'){
    CFG.slots.forEach((s,i)=>{if(i>0&&s.k==='h'&&!ids.has(s.p)){s.k='o';s.p='';s.n='';}});
    for(const c of clients){let s=CFG.slots.find(x=>x.k==='h'&&x.p===c.peer);
      if(!s){s=CFG.slots.find(x=>x.k==='o');if(s){s.k='h';s.p=c.peer;}}
      if(s)s.n=clean(c.presence.n)||'Player';}
    if($('#s-setup').classList.contains('on'))renderSetup();
  }else if(G){
    G.slots.forEach((s,i)=>{if(i>0&&s.k==='h'&&!ids.has(s.p)){s.k='b';s.d=1;s.p='';if(!G.over)toast((s.n||'A player')+' left. A bot takes over.');}});
    for(const c of clients){const idx=G.slots.findIndex(x=>x.k==='h'&&x.p===c.peer);if(idx<0)continue;
      const pr=c.presence.p;if(Array.isArray(pr))setPour(G,idx,pr[0]|0,pr[1]|0);else G.pl[idx].pour=null;
      const cmds=c.presence.c;if(!Array.isArray(cmds))continue;let last=NET.lastSeq[c.peer]||0;
      for(const m of cmds){if(Array.isArray(m)&&m[0]>last){last=m[0];runCmd(idx,m);}}
      NET.lastSeq[c.peer]=last;}
    readPings(peers,G.slots);
  }
  pushState();
}

async function joinCode(code,spec){

  NET.spec=!!spec;NET.nr.presence({r:'c',n:myName,c:[],spec:spec?1:0}).catch(()=>{});

function onClientPeers({peers}){
  if(NET.mode!=='client')return;

  NET.hadHost=true;const L=host.presence.L;if(!L||!Array.isArray(L.s))return;
  const slots=L.s.slice(0,8).map(a=>({k:a[0],n:clean(a[1]),t:a[2]|0,d:a[3]|0,p:String(a[4]||''),pe:a[5]|0}));

let REC=null,RP=null,LAST_REPLAY=null;
function recStart(){if(!G||NET.mode==='replay')return;REC={v:1,cfg:G.cfg,names:G.names,my:mySlot,frames:[],lastT:-1};}
function recFrame(g){if(!REC||!G)return;const t=Math.round(G.time*10)/10;if(t-REC.lastT<0.24&&!G.over)return;REC.lastT=t;REC.frames.push([t,g||encode(G,30000)]);}
function recFinish(){if(!REC||!REC.frames.length){REC=null;return;}recFrame(NET.mode==='client'?null:encode(G,30000));
  const r=REC;REC=null;r.win=G.winner;r.dur=G.time;LAST_REPLAY=r;
  // keep a lighter copy on the device: about one frame a second
  const thin={...r,frames:r.frames.filter((f,i)=>i%4===0||i===r.frames.length-1)};
  for(const step of [1,2,3]){try{const data=step===1?thin:{...thin,frames:thin.frames.filter((f,i)=>i%(step)===0||i===thin.frames.length-1)};store.set('hf-replay',JSON.stringify(data));if(store.get('hf-replay'))break;}catch(e){}}
  updateReplayBtn();}
function savedReplay(){if(LAST_REPLAY)return LAST_REPLAY;try{const s=store.get('hf-replay');return s?JSON.parse(s):null;}catch(e){return null;}}

  leaveNet();CAMP=null;NET.mode='replay';mySlot=-1;$('#toast').classList.remove('show');
  G=newGame({...rec.cfg});G.over=false;
  RP={rec,t:rec.frames[0][0],i:-1,playing:true,speed:4,end:rec.frames[rec.frames.length-1][0]};
  beginPlay();G.names=rec.names||G.names;$('#s-game').classList.add('replay');replayApply(true);renderReplayBar();
  resetCam(true);setCam(G.W/2,G.H/2,1,true);}
function replayIndex(t){const f=RP.rec.frames;let lo=0,hi=f.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(f[m][0]<=t)lo=m;else hi=m-1;}return lo;}
function replayApply(force){const i=replayIndex(RP.t);if(i===RP.i&&!force)return;const scrub=Math.abs(i-RP.i)>1;RP.i=i;
  G.over=false;decodeInto(G,RP.rec.frames[i][1]);G.over=false;G.csolT=Date.now();if(scrub){prevOwner=G.castles.map(c=>c.owner);prevLook=G.castles.map(c=>c.lv*8+c.b.length);fx=[];}}

  const r=$('#rp-range');r.max=String(Math.round(RP.end*10));if(!r.matches(':active'))r.value=String(Math.round(RP.t*10));$('#rp-time').textContent=fmtT(RP.t)+' / '+fmtT(RP.end);}

function simTick(){
  const now=performance.now();let dt=Math.min(1.5,(now-lastSim)/1000);lastSim=now;
  if(!G)return;
  if(NET.mode==='replay'){if(RP){if(RP.playing){RP.t=Math.min(RP.end,RP.t+dt*RP.speed);G.gt+=dt*RP.speed*G.sp;if(RP.t>=RP.end)RP.playing=false;}replayApply(false);renderReplayBar();}return;}

  if(NET.mode==='host'&&now-lastPush>100){lastPush=now;if(G.over&&PHASE==='play')PHASE='over';pushState();}
  if(G.over&&!overShown){overShown=true;PHASE='over';pourStop();recFinish();showGameOver();}

// ---------- commands ----------
function runCmd(slot,m){const t=m[1],a=m[2],b=m[3],c=m[4];if(!Number.isInteger(a))return;
  if(t===1)squad(G,slot,a,b);else if(t===2)setRoute(G,slot,a,b);else if(t===3)upgrade(G,slot,a,b);
  else if(t===4)setTax(G,slot,a,b);else if(t===5)research(G,slot,a);else if(t===6)useAbility(G,slot,a,b,c);else if(t===7)demolish(G,slot,a,b);else if(t===8)hire(G,slot,a);else if(t===9)setMix(G,slot,a);else if(t===10)setTrain(G,slot,a,b);else if(t===12)choosePath(G,slot,a,b);else if(t===14)buildWonder(G,slot);else if(t===15)startMastery(G,slot,a);else if(t===16)rushResearch(G,slot,a);else if(t===17)finishResearch(G,slot);else if(t===19)finishMastery(G,slot);else if(t===11)buildTower(G,slot,a,b);}
function issue(type,a,b=0,c=0){
  if(!G||G.over||mySlot<0||G.pl[mySlot].out)return;
  if(NET.mode==='client'){NET.seq++;NET.cmds.push([NET.seq,type,a,b|0,c|0]);if(NET.cmds.length>12)NET.cmds.shift();
    NET.nr&&NET.nr.presence({c:NET.cmds}).catch(()=>{});
    const k=G.castles[a];if(type===2&&k)k.route=(k.route===b||b<0)?-1:b;if(type===4&&k)k.tax=b;
  }else runCmd(mySlot,[0,type,a,b,c]);
  if(type===9&&G)G.pl[mySlot].mix=a;
  setTimeout(()=>{panelKey='';updatePanel();},60);
}
let pouring=null;
function pourStart(from,to){pouring={from,to};if(NET.mode==='client'){const k=from+'_'+to;if(k!==lastPourSent){lastPourSent=k;NET.nr&&NET.nr.presence({p:[from,to]}).catch(()=>{});}}else if(G)setPour(G,mySlot,from,to);}
function pourStop(){if(!pouring&&!lastPourSent)return;pouring=null;if(NET.mode==='client'){lastPourSent='';NET.nr&&NET.nr.presence({p:null}).catch(()=>{});}else if(G&&mySlot>=0)setPour(G,mySlot,-1,-1);}

const lastPing={};

const cv=$('#cv'),ctx=cv.getContext('2d');let VS={s:1,ox:0,oy:0,dpr:1,w:0,h:0},TH={};
const CAM={x:500,y:800,z:1,tx:500,ty:800,tz:1};
function baseScale(){return Math.max(0.01,Math.min((VS.w-12)/G.W,(VS.h-12)/G.H));}
function clampCam(o){const s=baseScale()*o.z;const hw=VS.w/(2*s),hh=VS.h/(2*s),m=24;
  o.x=hw*2>=G.W+2*m?G.W/2:Math.max(hw-m,Math.min(G.W-hw+m,o.x));o.y=hh*2>=G.H+2*m?G.H/2:Math.max(hh-m,Math.min(G.H-hh+m,o.y));}
function applyCam(){VS.s=baseScale()*CAM.z;VS.ox=VS.w/2-CAM.x*VS.s;VS.oy=VS.h/2-CAM.y*VS.s;}
function setCam(x,y,z,instant){CAM.tz=Math.max(1,Math.min(6,z));const t={x,y,z:CAM.tz};clampCam(t);CAM.tx=t.x;CAM.ty=t.y;if(instant){CAM.x=t.x;CAM.y=t.y;CAM.z=t.z;}}
function resetCam(instant){if(!G)return;if(VS.w===0)resize();const h=mySlot>=0?G.home[mySlot]:undefined;
  if(h!==undefined){const c=G.castles[h];setCam(c.x,c.y,VS.w<700?3.2:2.2,instant);}else setCam(G.W/2,G.H/2,1,instant);}
function zoomAt(sx,sy,f){const w={x:(sx-VS.ox)/VS.s,y:(sy-VS.oy)/VS.s};const z=Math.max(1,Math.min(6,CAM.z*f));const s=baseScale()*z;
  const t={x:w.x-(sx-VS.w/2)/s,y:w.y-(sy-VS.h/2)/s,z};clampCam(t);CAM.x=CAM.tx=t.x;CAM.y=CAM.ty=t.y;CAM.z=CAM.tz=z;applyCam();}
$('#z-in').onclick=()=>setCam(CAM.x,CAM.y,CAM.z*1.4);
$('#z-out').onclick=()=>setCam(CAM.x,CAM.y,CAM.z/1.4);
$('#z-fit').onclick=()=>setCam(G.W/2,G.H/2,1);
function stepCam(dt){const k=1-Math.exp(-dt*10);CAM.z+=(CAM.tz-CAM.z)*k;CAM.x+=(CAM.tx-CAM.x)*k;CAM.y+=(CAM.ty-CAM.y)*k;const t={x:CAM.x,y:CAM.y,z:CAM.z};clampCam(t);CAM.x=t.x;CAM.y=t.y;applyCam();}

function cellAt(x,y){const cx=Math.max(0,Math.min(FW-1,Math.floor(x/CELL))),cy=Math.max(0,Math.min(FH-1,Math.floor(y/CELL)));return cy*FW+cx;}

  else{const S=[];const nv=(1-0.4*nightLevel(G.time))*(mySlot>=0&&has(G,mySlot,18)?1.25:1);
    G.castles.forEach(c=>{
      if(!isTeam(c.owner))return;let r=c.capital>=0?300:210+Math.min(c.lv,3)*15;if(hasB(c,3))r=460;S.push({x:c.x,y:c.y,r:r*nv});});

    for(const t of G.tw)if(isTeam(t.o))S.push({x:t.x,y:t.y,r:130*nv});
    for(const s of S){const x0=Math.max(0,Math.floor((s.x-s.r)/CELL)),x1=Math.min(FW-1,Math.floor((s.x+s.r)/CELL)),y0=Math.max(0,Math.floor((s.y-s.r)/CELL)),y1=Math.min(FH-1,Math.floor((s.y+s.r)/CELL));

  if(mySlot>=0){const p=G.pl[mySlot];$('#gold').textContent=Math.floor(p.gold);$('#inc').textContent='+'+incomeOf(mySlot).toFixed(1);
    $('#troops').textContent=Math.floor(pw[mySlot]);$('#tcap').textContent='/'+armyCap(G,mySlot);
    $('#castles').textContent=G.castles.filter(c=>c.owner===mySlot).length;}
  else{$('#gold').textContent='–';$('#inc').textContent='';$('#troops').textContent='–';$('#tcap').textContent='';$('#castles').textContent='–';}
}
requestAnimationFrame(frame);

// ---------- stats ----------
function recordStats(dt){if(!stats||!G)return;stats.t+=dt;for(let s=0;s<8;s++){const v=G.pl[s].out?0:myTroops(s);if(v>stats.peak[s])stats.peak[s]=v;}
  if(stats.t>=5||!stats.hist.length){stats.t=0;const act=(sl,i)=>(sl.k==='h'||sl.k==='b');
    stats.hist.push(G.slots.map((sl,i)=>act(sl,i)&&!G.pl[i].out?Math.round(myTroops(i)):0));
    (stats.cas||(stats.cas=[])).push(G.slots.map((sl,i)=>act(sl,i)?G.castles.filter(c=>c.owner===i).length:0));
    (stats.gold||(stats.gold=[])).push(G.slots.map((sl,i)=>act(sl,i)?Math.round(G.pl[i].earned||0):0));
    (stats.kills||(stats.kills=[])).push(G.slots.map((sl,i)=>act(sl,i)?(G.pl[i].kills|0):0));}}
let statMetric='hist';
function drawStats(){
  const c=$('#chart');if(!c||!stats)return;const x=c.getContext('2d'),W=c.width,H=c.height,h=stats[statMetric]||stats.hist;
  document.querySelectorAll('#ov-card [data-m]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.m===statMetric));b.onclick=()=>{statMetric=b.dataset.m;drawStats();};});
  x.clearRect(0,0,W,H);const act=G.slots.map((s,i)=>(s.k==='h'||s.k==='b')?i:-1).filter(i=>i>=0);
  const max=Math.max(statMetric==='cas'?4:10,...h.flat());x.strokeStyle='rgba(128,128,128,.25)';x.lineWidth=1;for(let g=1;g<4;g++){x.beginPath();x.moveTo(0,H*g/4);x.lineTo(W,H*g/4);x.stroke();}
  for(const s of act){x.strokeStyle=COLORS[s];x.lineWidth=s===mySlot?5:3;x.lineJoin='round';x.beginPath();
    h.forEach((row,k)=>{const px=h.length>1?k/(h.length-1)*(W-20)+10:W/2,py=H-10-(row[s]/max)*(H-20);k?x.lineTo(px,py):x.moveTo(px,py);});x.stroke();}
  const tk=[],earned=G.pl.map(p=>p.earned||0);act.forEach(s=>tk[s]=G.pl[s].taken||stats.taken[s]||0);
  const best=arr=>act.reduce((b,i)=>(arr[i]||0)>(arr[b]||0)?i:b,act[0]);
  const lines=[['Conqueror',best(tk),tk[best(tk)]+' castles taken'],['Warlord',best(stats.peak),Math.round(stats.peak[best(stats.peak)])+' troops at peak'],['Treasurer',best(earned),Math.round(earned[best(earned)])+' gold earned']];
  const hl=$('#hl');hl.innerHTML='';for(const [tt,s,v] of lines){const d=document.createElement('div');const b=document.createElement('b');b.textContent=tt+': ';const n=document.createElement('span');n.textContent=ownerName(s)+', '+v;d.append(b,n);d.style.borderLeft='4px solid '+COLORS[s];d.style.paddingLeft='8px';hl.appendChild(d);}
}

// ---------- input: tap, hold-to-pour, pan, pinch, wheel ----------
function local(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function toWorld(p){return{x:(p.x-VS.ox)/VS.s,y:(p.y-VS.oy)/VS.s};}
function hitCastle(w,extra=12){let best=-1,bd=1e9;G.castles.forEach((c,i)=>{if(!isVisibleC(i)&&!seen[i])return;const f=footOf(c);const dx=(w.x-c.x)/(f.rx+extra/VS.s),dy=(w.y-c.y+f.ry*.3)/(f.ry*1.5+extra/VS.s);const d=dx*dx+dy*dy;if(d<1&&d<bd){bd=d;best=i;}});return best;}
function hitRoad(w){let best=null,bd=(24/VS.s)**2;if(mySlot<0)return null;
  for(const e of G.edges){const a=G.castles[e.a],b=G.castles[e.b];const d=segDist2(w.x,w.y,a.x,a.y,b.x,b.y);
    if(d<bd){const ma=a.owner===mySlot,mb=b.owner===mySlot;if(!ma&&!mb)continue;const da=Math.hypot(w.x-a.x,w.y-a.y),db=Math.hypot(w.x-b.x,w.y-b.y);
      let from;if(ma&&mb)from=da<db?e.a:e.b;else from=ma?e.a:e.b;bd=d;best={from,to:from===e.a?e.b:e.a};}}
  return best;}
const PT=new Map();let pinch=null,pourTimer=0;
function canAct(){return G&&!G.over&&mySlot>=0&&!G.pl[mySlot].out;}
cv.addEventListener('pointerdown',e=>{
  if(!G)return;const p=local(e);PT.set(e.pointerId,p);try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(PT.size===2){const [a,b]=[...PT.values()];pourStop();clearTimeout(pourTimer);gesture={mode:'none'};
    pinch={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,z0:CAM.z,w:toWorld({x:(a.x+b.x)/2,y:(a.y+b.y)/2})};return;}
  if(PT.size>2)return;
  for(const a of ALERT_IND)if(Math.hypot(a.x-p.x,a.y-p.y)<34){const c=G.castles[a.c];setCam(c.x,c.y,Math.max(CAM.z,2.4));gesture={mode:'none'};return;}
  const w=toWorld(p);gesture={mode:'pan',start:p,last:p,moved:false,w};
  if(armedAb>=0||!canAct())return;
  const ci=hitCastle(w);
  if(ci>=0&&G.castles[ci].owner===mySlot){gesture.mode='castle';gesture.ci=ci;return;}
  if(ci<0){const r=hitRoad(w);if(r){gesture.mode='road';gesture.road=r;pourTimer=setTimeout(()=>{if(gesture&&gesture.mode==='road'){gesture.mode='pour';pourStart(r.from,r.to);}},170);}}
});
cv.addEventListener('pointermove',e=>{
  if(!G||!PT.has(e.pointerId))return;const p=local(e);PT.set(e.pointerId,p);
  if(pinch&&PT.size>=2){const [a,b]=[...PT.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    const z=Math.max(1,Math.min(6,pinch.z0*d/pinch.d0)),s=baseScale()*z;const tt={x:pinch.w.x-(m.x-VS.w/2)/s,y:pinch.w.y-(m.y-VS.h/2)/s,z};clampCam(tt);
    CAM.x=CAM.tx=tt.x;CAM.y=CAM.ty=tt.y;CAM.z=CAM.tz=z;applyCam();return;}
  const g=gesture;if(!g)return;const w=toWorld(p);
  if(!g.moved&&Math.hypot(p.x-g.start.x,p.y-g.start.y)>10)g.moved=true;
  if(g.mode==='castle'&&g.moved){const c=G.castles[g.ci];const dx=w.x-c.x,dy=w.y-c.y,L=Math.hypot(dx,dy);
    if(L>footOf(c).rx*.9){let bt=-1,bc=0.35;for(const {to} of G.adj[g.ci]){const tc=G.castles[to];const tx=tc.x-c.x,ty=tc.y-c.y,tl=Math.hypot(tx,ty);const cs=(dx*tx+dy*ty)/(L*tl);if(cs>bc){bc=cs;bt=to;}}
      if(bt>=0){g.mode='pour';g.road={from:g.ci,to:bt};pourStart(g.ci,bt);}}}
  if(g.mode==='pour'){const tc=G.castles[g.road.to];const f=footOf(tc);g.lock=Math.hypot((w.x-tc.x)/(f.rx+20/VS.s),(w.y-tc.y)/(f.ry+20/VS.s))<1.1;}
  if(g.mode==='pan'&&g.moved){CAM.x-=(p.x-g.last.x)/VS.s;CAM.y-=(p.y-g.last.y)/VS.s;const tt={x:CAM.x,y:CAM.y,z:CAM.z};clampCam(tt);CAM.x=CAM.tx=tt.x;CAM.y=CAM.ty=tt.y;applyCam();}
  g.last=p;
});
function endPtr(e,cancel){
  if(!PT.has(e.pointerId))return;const p=local(e);PT.delete(e.pointerId);
  if(pinch){if(PT.size<2)pinch=null;if(PT.size===0)gesture=null;return;}
  const g=gesture;gesture=null;clearTimeout(pourTimer);if(!G||!g)return;
  if(g.mode==='pour'){const lock=g.lock;pourStop();if(!cancel&&lock){issue(2,g.road.from,g.road.to);toast('Route locked to '+G.names[g.road.to]+'. Quick-tap the road to stop it.',2600);}return;}
  if(cancel||g.moved&&g.mode!=='road')return;
  const w=toWorld(p);
  if(g.mode==='road'){const c=G.castles[g.road.from];if(c.route===g.road.to){issue(2,g.road.from,-1);toast('Route stopped.',1500);}else{issue(1,g.road.from,g.road.to);fxRing(c.x,c.y,colOf(mySlot),false);}return;}
  if(g.mode==='castle'){sel=sel===g.ci?-1:g.ci;panelKey='';updatePanel();if(sel>=0){const c=G.castles[sel];const want=VS.h*0.28;const sy=c.y*VS.s+VS.oy;if(sy>want+40){setCam(CAM.x,c.y+(VS.h/2-want)/VS.s,CAM.z);}}return;}
  const ci=hitCastle(w);
  if(armedAb===0){issue(6,0,Math.round(w.x),Math.round(w.y));toast('Fire Rain incoming.',1500);armedAb=-1;updateBar();return;}
  if(armedAb===1){if(ci>=0&&!isTeam(G.castles[ci].owner)&&isVisibleC(ci)){issue(6,1,ci);toast('Breaching the walls of '+G.names[ci]+'.',1800);armedAb=-1;}else toast('Pick an enemy or neutral castle you can see.',1500);updateBar();return;}
  if(armedAb===2){issue(6,2,Math.round(w.x),Math.round(w.y));toast('Scouts sent.',1500);armedAb=-1;updateBar();return;}
  if(ci>=0){if(canAct()&&sel>=0&&sel!==ci&&G.castles[sel].owner===mySlot&&G.edgeKey[sel+'_'+ci]!==undefined){issue(1,sel,ci);return;}
    sel=sel===ci?-1:ci;panelKey='';updatePanel();return;}
  sel=-1;updatePanel();
}
cv.addEventListener('pointerup',e=>{endPtr(e,false);panelAt=Math.max(panelAt,performance.now()-50);});
cv.addEventListener('pointercancel',e=>endPtr(e,true));
cv.addEventListener('wheel',e=>{if(!G)return;e.preventDefault();const p=local(e);zoomAt(p.x,p.y,Math.exp(-e.deltaY*0.0015));},{passive:false});
document.addEventListener('keydown',e=>{
  if(!G||!$('#s-game').classList.contains('on')||e.target.tagName==='INPUT')return;
  if(e.key==='Escape'){sel=-1;armedAb=-1;updatePanel();updateBar();}
  else if(e.key==='+'||e.key==='=')$('#z-in').click();else if(e.key==='-')$('#z-out').click();else if(e.key==='0')$('#z-fit').click();
});

</script>
